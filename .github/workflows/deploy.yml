name: CI/CD Pipeline - Cloudflare Pages

on:
  push:
    branches:
      - staging
      - main

  pull_request:
    branches:
      - staging
      - main

  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

# --------------------
# CODE QUALITY
# --------------------
jobs:
  quality-checks:
    name: Code Quality & Type Checking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # --------------------
  # BUILD
  # --------------------
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: 🏗️ Build (Staging)
        if: github.ref != 'refs/heads/main'
        run: npm run build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY_STAGING }}

      - name: 🏗️ Build (Production)
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY_PROD }}

      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: out
          retention-days: 1

  # --------------------
  # STAGING DEPLOY
  # --------------------
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    environment:
      name: staging
      url: https://staging.nexl.dev

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: out

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=nexl-staging

  # --------------------
  # PRODUCTION DEPLOY
  # --------------------
  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://nexl.dev

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: out

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=nexl-production

  # --------------------
  # PR PREVIEW
  # --------------------
  deploy-preview:
    name: 🔍 PR Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: out

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=nexl-staging --branch=pr-${{ github.event.pull_request.number }}
