name: CI Pipeline

on:
  pull_request:
    branches:
      - staging
      - main

  push:
    branches:
      - staging
      - main

env:
  NODE_VERSION: '20.x'

jobs:
  # --------------------
  # CODE QUALITY
  # --------------------
  quality-checks:
    name: Code Quality & Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # --------------------
  # BUILD VERIFICATION
  # --------------------
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
